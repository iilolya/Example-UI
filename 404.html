<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Страница не найдена | Эмилия Савенцова</title>
  <style>
    /* базовые стили страницы ошибки */
    .error {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 24px 80px;
      background-color: #0e0e0e;
      position: relative;
      overflow: hidden;
    }

    .error__content {
      position: relative;
      z-index: 2;
      max-width: 600px;
    }

    .error__code {
      font-size: 120px;
      font-weight: 700;
      color: #c9a96e;
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -5px;
      opacity: 0.9;
    }

    .error__title {
      color: #c9a96e;
      font-size: 28px;
      font-weight: 300;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .error__text {
      color: #999;
      font-size: 16px;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .error__btn {
      display: inline-block;
      padding: 14px 40px;
      border: 1px solid #c9a96e;
      color: #c9a96e;
      font-size: 14px;
      letter-spacing: 2px;
      border-radius: 50px;
      transition: 0.3s;
      text-decoration: none;
    }

    .error__btn:hover {
      background-color: #c9a96e;
      color: #0e0e0e;
    }

    /* декоративные элементы фона */
    .error__light {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,169,110,0.15) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      animation: floatLight 8s ease-in-out infinite;
    }

    .error__light--top-left {
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }

    .error__light--bottom-right {
      bottom: 10%;
      right: 10%;
      animation-delay: -4s;
      width: 200px;
      height: 200px;
    }

    @keyframes floatLight {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -20px); }
    }

    /* адаптивные стили */
    @media (max-width: 768px) {
      .error__code {
        font-size: 80px;
        letter-spacing: -3px;
      }
      .error__title {
        font-size: 24px;
      }
      .error__text {
        font-size: 14px;
      }
      .error__btn {
        padding: 12px 32px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <main class="error" id="error">
    <div class="error__light error__light--top-left"></div>
    <div class="error__light error__light--bottom-right"></div>

    <div class="error__content">
      <div class="error__code">404</div>
      <h1 class="error__title">Страница не найдена</h1>
      <p class="error__text">
        Похоже, этот кадр потерялся в архиве.<br>
        Вернитесь на главную и выберите другую фотографию.
      </p>
      <a href="index.html" class="error__btn">На главную</a>
    </div>
  </main>

</body>
</html>
